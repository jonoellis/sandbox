<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Connections - Special Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-color: #ffffff;
      --text-color: #121212;
      --tile-bg: #efefe6;
      --tile-bg-selected: #5a595e;
      --tile-text-selected: #ffffff;
      
      /* NYT Connections Palette */
      --color-yellow: #f9df6d;
      --color-green: #a0c35a;
      --color-blue: #b0c4ef;
      --color-purple: #ba81c5;
      
      --color-yellow-dark: #121212;
      --color-green-dark: #121212;
      --color-blue-dark: #121212;
      --color-purple-dark: #121212;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 630px;
      text-align: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    main {
      width: 100%;
      max-width: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Grid Layout */
    .grid-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tile {
      aspect-ratio: 1.33 / 1;
      background-color: var(--tile-bg);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      text-align: center;
      padding: 4px;
      transition: background-color 0.15s ease, transform 0.1s ease, color 0.15s ease;
      word-break: break-word;
    }

    .tile:active {
      transform: scale(0.96);
    }

    /* Solved Row Banner */
    .solved-row {
      grid-column: span 4;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    .solved-row .category-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .solved-row .category-items {
      font-size: 13px;
      font-weight: 500;
    }

    /* Color Classes */
    .color-yellow { background-color: var(--color-yellow) !important; color: var(--color-yellow-dark) !important; }
    .color-green  { background-color: var(--color-green) !important;  color: var(--color-green-dark) !important; }
    .color-blue   { background-color: var(--color-blue) !important;   color: var(--color-blue-dark) !important; }
    .color-purple { background-color: var(--color-purple) !important; color: var(--color-purple-dark) !important; }

    /* Controls & Mistake Tracker */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
    }

    .mistakes-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }

    .dots-container {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: #5a595e;
      border-radius: 50%;
      transition: opacity 0.2s;
    }

    .dot.lost {
      opacity: 0.2;
    }

    .btn-submit {
      padding: 12px 28px;
      background-color: #121212;
      color: #ffffff;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: none;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-submit:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    /* Results Popup / Banner */
    .score-banner {
      width: 100%;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }

    .score-banner h2 {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .score-banner p {
      font-size: 14px;
      color: #444;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @media (max-width: 480px) {
      .tile {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Connections</h1>
    <div class="subtitle">Group words that share a common thread.</div>
  </header>

  <main>
    <div class="grid-container" id="grid"></div>

    <div class="controls">
      <div class="mistakes-container" id="mistakesContainer">
        <span>Mistakes remaining:</span>
        <div class="dots-container" id="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <button class="btn-submit" id="submitBtn" disabled>Submit Answers</button>
    </div>

    <div class="score-banner" id="scoreBanner"></div>
  </main>

  <script>
    const COLOR_ORDER = ['yellow', 'green', 'blue', 'purple'];
    
    let categories = [];
    let words = [];
    let state = {
      clicks: 0,
      phase: 'initial', // 'initial', 'failed', 'complete'
      mistakesLeft: 4,
      assignments: {} // maps wordText -> colorName
    };

    const gridEl = document.getElementById('grid');
    const submitBtn = document.getElementById('submitBtn');
    const scoreBanner = document.getElementById('scoreBanner');
    const dotsEl = document.getElementById('dots');

    // Fetch JSON and initialize
    async function initGame() {
      try {
        const response = await fetch('connections.json');
        categories = await response.json();
      } catch (e) {
        // Fallback default demo data if json fetch fails or local testing
        categories = [
          { "category": "CMYK COLOURS", "color": "yellow", "items": ["CYAN", "MAGENTA", "YELLOW", "BLACK"] },
          { "category": "DIRECTIONS", "color": "green", "items": ["UP", "DOWN", "LEFT", "RIGHT"] },
          { "category": "TYPES OF TRUCK", "color": "blue", "items": ["LORRY", "TRUCK", "TANKER", "ARCTIC"] },
          { "category": "SHAPES", "color": "purple", "items": ["CIRCLE", "SQUARE", "TRIANGLE", "PENTAGON"] }
        ];
      }

      // Extract all words and shuffle
      words = categories.flatMap(cat => cat.items.map(item => ({
        text: item,
        category: cat.category,
        correctColor: cat.color
      })));
      
      shuffle(words);
      renderGrid();
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function renderGrid() {
      gridEl.innerHTML = '';

      // Check which colors currently have EXACTLY 4 words assigned
      const counts = {};
      COLOR_ORDER.forEach(c => counts[c] = 0);
      Object.values(state.assignments).forEach(c => {
        if (counts[c] !== undefined) counts[c]++;
      });

      const fullColors = COLOR_ORDER.filter(c => counts[c] === 4);

      // Group full color sets into top banners
      fullColors.forEach(color => {
        const colorWords = words.filter(w => state.assignments[w.text] === color);
        // Find category if all 4 actually match a true category
        const matchedCat = categories.find(cat => 
          cat.items.every(item => state.assignments[item] === color)
        );

        const banner = document.createElement('div');
        banner.className = `solved-row color-${color}`;
        
        const title = document.createElement('div');
        title.className = 'category-title';
        title.textContent = matchedCat ? matchedCat.category : `${color.toUpperCase()} GROUP`;

        const items = document.createElement('div');
        items.className = 'category-items';
        items.textContent = colorWords.map(w => w.text).join(', ');

        banner.appendChild(title);
        banner.appendChild(items);
        gridEl.appendChild(banner);
      });

      // Render remaining un-grouped words
      words.forEach(wordObj => {
        const assignedColor = state.assignments[wordObj.text];
        
        // Skip rendering as separate tile if part of a complete 4-word row banner
        if (assignedColor && fullColors.includes(assignedColor)) {
          return;
        }

        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = wordObj.text;

        if (assignedColor) {
          tile.classList.add(`color-${assignedColor}`);
        }

        tile.addEventListener('click', () => handleTileClick(wordObj.text));
        gridEl.appendChild(tile);
      });

      validateSubmitButtonState();
    }

    function handleTileClick(wordText) {
      if (state.phase === 'complete') return;

      if (state.phase === 'initial') {
        if (state.assignments[wordText]) return; // Already clicked

        // Determine active group color based on click count
        const groupIndex = Math.floor(state.clicks / 4);
        const activeColor = COLOR_ORDER[groupIndex];

        state.assignments[wordText] = activeColor;
        state.clicks++;

        renderGrid();

        // On 16th click evaluate initial attempt immediately
        if (state.clicks === 16) {
          checkPerfectInitialRun();
        }
      } 
      else if (state.phase === 'failed') {
        // Cycle colors on click
        const currentColor = state.assignments[wordText];
        let nextIndex = 0;
        
        if (currentColor) {
          const currentIndex = COLOR_ORDER.indexOf(currentColor);
          nextIndex = (currentIndex + 1) % COLOR_ORDER.length;
        }
        
        state.assignments[wordText] = COLOR_ORDER[nextIndex];
        renderGrid();
      }
    }

    function checkPerfectInitialRun() {
      const isPerfect = categories.every(cat => {
        const firstWordColor = state.assignments[cat.items[0]];
        return cat.items.every(item => state.assignments[item] === firstWordColor);
      });

      if (isPerfect) {
        state.phase = 'complete';
        triggerConfetti();
        showScoreBanner("Perfect! You got all sets right on your first try!", 16);
      } else {
        // Failed initial check: prompt interactive edit phase with Submit button
        state.phase = 'failed';
        state.mistakesLeft--;
        updateMistakesUI();
        submitBtn.style.display = 'block';
        renderGrid();
      }
    }

    function validateSubmitButtonState() {
      if (state.phase !== 'failed') return;

      // Ensure every word has a color assigned and exactly 4 of each color exist
      const counts = {};
      COLOR_ORDER.forEach(c => counts[c] = 0);
      
      let totalAssigned = 0;
      Object.values(state.assignments).forEach(c => {
        if (counts[c] !== undefined) {
          counts[c]++;
          totalAssigned++;
        }
      });

      const is4x4 = totalAssigned === 16 && COLOR_ORDER.every(c => counts[c] === 4);
      submitBtn.disabled = !is4x4;
    }

    submitBtn.addEventListener('click', () => {
      if (state.phase !== 'failed' || submitBtn.disabled) return;

      // Calculate score across sets
      let totalScore = 0;
      let perfectSets = 0;

      categories.forEach(cat => {
        // Count how many items in this category share the most frequent assigned color
        const colorCounts = {};
        cat.items.forEach(item => {
          const col = state.assignments[item];
          colorCounts[col] = (colorCounts[col] || 0) + 1;
        });

        const maxMatch = Math.max(...Object.values(colorCounts));

        if (maxMatch === 4) {
          totalScore += 4;
          perfectSets++;
        } else if (maxMatch === 3) {
          totalScore += 3;
        }
        // 2 or 1 correct gives 0 points
      });

      if (perfectSets === 4) {
        state.phase = 'complete';
        submitBtn.style.display = 'none';
        triggerConfetti();
        showScoreBanner(`Congratulations! Perfect score: ${totalScore}/16 points!`, totalScore);
      } else {
        state.mistakesLeft--;
        updateMistakesUI();

        if (state.mistakesLeft <= 0) {
          state.phase = 'complete';
          submitBtn.style.display = 'none';
          showScoreBanner(`Game Over! Final Score: ${totalScore}/16 points.`, totalScore);
        } else {
          showScoreBanner(`Score so far: ${totalScore}/16 points. Adjust your groups and try again!`, totalScore);
        }
      }
    });

    function updateMistakesUI() {
      const dots = dotsEl.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        if (idx >= state.mistakesLeft) {
          dot.classList.add('lost');
        }
      });
    }

    function showScoreBanner(message, score) {
      scoreBanner.style.display = 'block';
      scoreBanner.innerHTML = `<h2>${message}</h2>`;
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
</body>
</html>
