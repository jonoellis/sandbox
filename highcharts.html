<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Data & Chart</title>
    <script src="highcharts.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        #chart-container {
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>

    <h2>Traffic Data Table</h2>
    <table id="traffic-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Traffic</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="chart-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tableBody = document.querySelector('#traffic-table tbody');
            const dates = [];
            const trafficData = [];

            // 1. Generate 10 days of data and populate the table
            for (let i = 1; i <= 10; i++) {
                // Format date string (e.g., "01 Jan 2026")
                const day = i < 10 ? `0${i}` : i;
                const dateStr = `${day} Jan 2026`;
                
                // Generate random 4-digit number (1000 to 9999)
                const randomTraffic = Math.floor(1000 + Math.random() * 9000);

                // Store data for the chart
                dates.push(dateStr);
                trafficData.push(randomTraffic);

                // Append row to the table
                const row = `<tr>
                    <td>${dateStr}</td>
                    <td>${randomTraffic}</td>
                </tr>`;
                tableBody.innerHTML += row;
            }

            // 2. Initialize Highcharts using the generated data
            Highcharts.chart('chart-container', {
                chart: {
                    type: 'line'
                },
                title: {
                    text: 'Daily Traffic Overview'
                },
                xAxis: {
                    categories: dates
                },
                yAxis: {
                    title: {
                        text: 'Traffic Volume'
                    }
                },
                series: [{
                    name: 'Traffic',
                    data: trafficData,
                    color: '#007bef'
                }],
                credits: {
                    enabled: false
                }
            });
        });
    </script>
    <a href = "https://code.highcharts.com/highcharts.js">downlaod</a>
</body>
</html>
