[[headers]]
  for = "/*"
  [headers.values]
    # Set to 'Content-Security-Policy-Report-Only' while testing to prevent breaking execution
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; img-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; frame-src 'self' https://www.googletagmanager.com;"