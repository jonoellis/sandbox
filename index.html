<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Chatbot (Hugging Face SmolLM2)</title>
    
    <!-- Fixed: Inline baseline icon data to instantly clear the 404 favicon error -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">

    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background-color: #f9f9f9; }
        #log { background: #eee; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 12px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #ddd; }
        #output { padding: 15px; border: 1px solid #ccc; min-height: 100px; background: #fff; white-space: pre-wrap; border-radius: 4px; }
        button, input { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background-color: #0070f3; color: white; border: none; cursor: pointer; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        input { width: 65%; margin-right: 10px; }
        .control-group { margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Local Browser-Based AI (Hugging Face)</h2>
    
    <div class="control-group">
        <p>Status / Download Progress:</p>
        <div id="log">Click "Initialize AI" to pull Hugging Face SmolLM2 into cache...</div>
        <button id="init-btn">1. Initialize AI</button>
    </div>

    <div class="control-group">
        <input type="text" id="prompt" value="Write a short poem about a Chromebook." disabled />
        <button id="send-btn" disabled>2. Ask AI</button>
    </div>

    <h3>Response:</h3>
    <div id="output"></div>

    <script type="module">
        // Fixed: Bypasses standard CDN routing paths using a raw un-redirected ESM build structure
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const selectedModel = "SmolLM2-360M-Instruct-q4f16_1-MLC";
        let engine;

        const logDiv = document.getElementById("log");
        const outputDiv = document.getElementById("output");
        const initBtn = document.getElementById("init-btn");
        const sendBtn = document.getElementById("send-btn");
        const promptInput = document.getElementById("prompt");

        const updateAppConfig = (report) => {
            logDiv.innerText += "\n" + report.text;
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        initBtn.onclick = async () => {
            initBtn.disabled = true;
            logDiv.innerText = "Checking GPU hardware access...";

            if (!navigator.gpu) {
                logDiv.innerText = "❌ WebGPU support is missing or restricted on this domain.\n\n" +
                                   "Make sure your Netlify deployment includes the '_headers' file!";
                initBtn.disabled = false;
                return;
            }
            
            logDiv.innerText = "WebGPU verified. Accessing Hugging Face model storage...";
            
            try {
                engine = await webllm.CreateMLCEngine(
                    selectedModel,
                    { initProgressCallback: updateAppConfig }
                );
                logDiv.innerText += "\n\n🎉 Success! Hugging Face Model is cached. You can go offline now.";
                promptInput.disabled = false;
                sendBtn.disabled = false;
            } catch (err) {
                logDiv.innerText += "\n\n❌ Initialization Failed: " + err.message;
                console.error(err);
                initBtn.disabled = false;
            }
        };

        sendBtn.onclick = async () => {
            const text = promptInput.value;
            outputDiv.innerText = "Generating local tokens...";
            sendBtn.disabled = true;
            
            const messages = [{ role: "user", content: text }];
            
            try {
                const chunks = await engine.chat.completions.create({
                    messages,
                    stream: true
                });

                outputDiv.innerText = "";
                for await (const chunk of chunks) {
                    const curDelta = chunk.choices?.delta?.content;
                    if (curDelta) {
                        outputDiv.innerText += curDelta;
                    }
                }
            } catch (err) {
                outputDiv.innerText = "Generation Error: " + err.message;
            } finally {
                sendBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
